<!doctype html>
<html><head><meta charset="utf-8"><title>Owner Login - MediFind</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/medifind.css') }}"></head>
<body>
  {% include '_header.html' %}
  <main class="auth-shell"><section class="auth-panel">
    <p class="page-kicker">Pharmacy workspace</p><h1>Owner sign-in</h1>
    <p>Manage your pharmacy details and owner-confirmed inventory.</p>
    <form class="auth-form" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>Email address<input name="email" type="email" autocomplete="username" placeholder="you@example.com" required></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" placeholder="Password" required></label>
      <button type="submit">Sign in</button>
    </form>
    <div class="auth-links"><a href="{{ url_for('user_register') }}">Register an owner account</a><a href="{{ url_for('home') }}">Back to MediFind</a></div>
  </section></main>
</body></html>
