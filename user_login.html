<!doctype html>
<html><head><meta charset="utf-8"><title>User Login - MediFind</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/medifind.css') }}"></head>
<body>
  {% include '_header.html' %}
  <main class="auth-shell"><section class="auth-panel">
    <p class="page-kicker">Welcome back</p><h1>Sign in</h1>
    <p>Sign in to search verified pharmacy inventory near your chosen location.</p>
    <form class="auth-form" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>Email address<input name="email" type="email" autocomplete="email" placeholder="you@example.com" required></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" placeholder="Password" required></label>
      <button type="submit">Sign in</button>
    </form>
    <div class="auth-links"><a href="{{ url_for('user_register') }}">Create an account</a><a href="{{ url_for('owner_login') }}">Pharmacy owner sign-in</a></div>
  </section></main>
</body></html>
